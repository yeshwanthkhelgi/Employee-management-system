<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payroll List</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #90dffe, #38a3d1);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 1100px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-center m-0">Payroll Management</h2>
    
    <div>
        <a href="/" class="btn btn-secondary me-2">
            <i class="fas fa-arrow-left"></i> Employee Management
        </a>

        <a href="/payroll/add" class="btn btn-primary">
            <i class="fas fa-plus-circle"></i> Add Payroll
        </a>
    </div>
</div>


        <div class="table-responsive">
            <table class="table table-hover table-striped">
                <thead class="table-success">
                <tr>
                    <th>Employee ID</th>
                    <th>Base Salary</th>
                    <th>Bonus</th>
                    <th>Deductions</th>
                    <th>Net Salary</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="payroll : ${payrollList}">
                    <td th:text="${payroll.employee.id}"></td> <!-- Fixed field -->
                    <td th:text="${payroll.baseSalary}"></td>
                    <td th:text="${payroll.bonus}"></td>        <!-- Fixed field -->
                    <td th:text="${payroll.deductions}"></td>
                    <td th:text="${payroll.netSalary}"></td>
                    <td>
                        <a th:href="@{/payroll/showFormForUpdatePayroll/{id}(id=${payroll.id})}" 
                           class="btn btn-warning me-2">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a href="#" th:data-url="@{/payroll/deletePayroll/{id}(id=${payroll.id})}"
                           class="btn btn-danger"
                           onclick="confirmDelete(this)">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

<!-- SweetAlert2 for confirmation -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    function confirmDelete(element) {
        const url = element.getAttribute('data-url');

        Swal.fire({
            title: 'Are you sure?',
            text: "You won't be able to revert this!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Yes, delete it!'
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = url;
            }
        });
    }
</script>

</body>
</html>
