name: CI/CD Pipeline for Employee Management System

on:
  push:
    branches:
      - develop  # Updated branch to develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:  # Manual trigger option

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean install

      - name: Run Tests
        run: mvn test

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server
        run: |
          echo "Deploying to server..."
          # Example deployment steps (replace with your actual commands)
          # SCP the build artifact to the server
          # scp target/*.jar user@your-server:/path/to/deploy
          # SSH into the server and restart the service
          # ssh user@your-server "systemctl restart your-service"
